<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMC Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#16202c;--mute:#637083;--line:#d9dfe7;--navy:#12263f;--acc:#e3a008;--low:#c2391f;--ok:#2f7d4f;--okbg:#e6f4ec;--lowbg:#fdecea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;font-size:16px;line-height:1.5}
header{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{max-width:640px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:10px}
.logo{background:var(--acc);color:#12263f;font-weight:700;padding:2px 9px;border-radius:4px;font-size:18px}
.bar h1{margin:0;font-size:17px;font-weight:600;flex:1}
.bar button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:4px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:14px}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:15px;margin:18px 0 8px;color:var(--mute);font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:10px;padding:26px 12px;font:inherit;font-size:20px;font-weight:700;cursor:pointer;text-align:center;color:#fff}
.tile small{display:block;font-size:13px;font-weight:400;opacity:.85;margin-top:2px}
.t1{background:var(--ok)}.t2{background:var(--low)}.t3{background:var(--navy)}.t4{background:var(--acc);color:#12263f}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:600;padding:12px 16px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{border-color:var(--acc);background:var(--acc);color:#12263f}
.chip small{display:block;font-weight:400;font-size:12px}
input{font:inherit;color:inherit;width:100%;padding:12px;border:2px solid var(--line);border-radius:8px;background:var(--card)}
input:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
input.big{font-size:24px;font-weight:700}
.go{width:100%;margin-top:20px;padding:15px;border:0;border-radius:8px;font:inherit;font-size:18px;font-weight:700;color:#fff;cursor:pointer}
.go.in{background:var(--ok)}.go.out{background:var(--low)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-weight:600}.sub{font-size:13px;color:var(--mute)}
.in-c{color:var(--ok);font-weight:700}.out-c{color:var(--low);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.stat b{display:block;font-size:24px;line-height:1.2}.stat span{font-size:13px;color:var(--mute)}
.avail{margin-top:8px;font-size:14px;color:var(--mute)}
.wrap{overflow-x:auto;margin-bottom:8px}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--navy);color:#fff;font-weight:600}
td.n,th.n{text-align:right}
.btns{display:flex;gap:8px;margin:12px 0}
.b{flex:1;font:inherit;font-weight:600;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:22px 10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:8px;font-weight:600;z-index:9}
@media print{header,.btns,.chips{display:none}body{background:#fff}}

:root{--bg:#f4f8fb;--line:#dbe4ec}
header{background:#fff;color:var(--navy);border-bottom:1px solid var(--line)}
.bar button{border-color:var(--line);color:var(--navy)}
.tile{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 10px rgba(18,38,63,.06);display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 10px}
.tile small{color:var(--mute);opacity:1}
.ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;color:#fff;margin-bottom:4px}
.t1 .ic{background:var(--ok)}.t2 .ic{background:var(--low)}.t3 .ic{background:var(--navy)}.t4 .ic{background:var(--acc);color:#12263f}
.hello{margin:4px 0 16px}.hello b{font-size:22px;display:block}.hello span{color:var(--mute);font-size:15px}
.foot{text-align:center;margin:44px 0 12px;color:var(--mute)}
.foot svg{display:block;margin:0 auto 10px}
.foot b{display:block;font-size:16px;letter-spacing:.2em;color:var(--navy);font-weight:600}
.foot span{font-size:12px}
.dd{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border:2px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:16px;color:var(--ink);cursor:pointer;text-align:left}
.ddp{border:2px solid var(--acc);border-radius:8px;margin-top:6px;background:#fff;max-height:320px;overflow-y:auto;padding:8px}
.ddo{display:block;width:100%;text-align:left;padding:11px 10px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:var(--ink);cursor:pointer}
.ddo.on{background:var(--okbg);font-weight:700}
.inv{max-height:90px;border-radius:6px;margin-top:8px;cursor:pointer;display:block}.inv.big{max-height:none;width:100%}
dialog{border:0;border-radius:10px;padding:18px;width:min(92vw,400px);background:#fff;color:var(--ink)}dialog::backdrop{background:rgba(0,0,0,.45)}

/* premium theme */
:root{--bg:#f5f3ee;--card:#fff;--ink:#1a2330;--mute:#6f7785;--line:#e7e2d7;--navy:#0f2a43;--acc:#c9a24a;--ok:#2a7d5f;--okbg:#e5f3ed;--low:#b8452f;--lowbg:#fbeae6;--sh:0 8px 26px rgba(15,42,67,.08);--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif}
body{background:radial-gradient(900px 420px at 100% -10%,rgba(201,162,74,.14),transparent 60%),radial-gradient(700px 400px at -10% 0,rgba(15,42,67,.07),transparent 60%),var(--bg);background-attachment:fixed}
header{background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{background:linear-gradient(135deg,#0f2a43,#1f4d78);color:#ecd18a;border-radius:9px;padding:3px 10px;font-family:var(--serif);font-size:20px;letter-spacing:.08em;box-shadow:0 2px 8px rgba(15,42,67,.25)}
.bar h1{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--navy);letter-spacing:.02em}
.bar button{border-radius:999px;padding:6px 14px}
h2,.hero .hb{font-family:var(--serif);font-weight:700;font-variant-numeric:lining-nums}
h2{font-size:26px;color:var(--navy);margin-bottom:14px}
h3{text-transform:none;font-size:13px;letter-spacing:.04em;color:var(--mute)}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:24px 20px 18px;margin-bottom:18px;color:#fff;background:linear-gradient(140deg,#0b2239 0%,#153e63 70%,#1d5482 100%);box-shadow:0 14px 34px rgba(15,42,67,.28)}
.hero:before{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(236,209,138,.35),transparent 65%)}
.hero .hk{font-size:13px;letter-spacing:.14em;color:#ecd18a;position:relative}
.hero .hb{font-size:32px;line-height:1.15;margin:2px 0 14px;position:relative}
.hero .hst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative}
.hero .hst div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:9px 6px;text-align:center}
.hero .hst b{display:block;font-size:22px;line-height:1.2}
.hero .hst span{font-size:11.5px;opacity:.8}
.tiles{gap:14px}
.tile{border-radius:22px;border:1px solid var(--line);box-shadow:var(--sh);padding:24px 10px 20px;font-size:18px;font-weight:600;transition:transform .15s,box-shadow .15s}
.tile:active{transform:scale(.97)}
.tile small{font-size:12.5px}
.ic{width:58px;height:58px;font-size:27px;box-shadow:0 8px 16px rgba(15,42,67,.2),inset 0 1px 0 rgba(255,255,255,.35)}
.t1 .ic{background:linear-gradient(145deg,#3fae86,#1e7656)}
.t2 .ic{background:linear-gradient(145deg,#df7458,#b03f29)}
.t3 .ic{background:linear-gradient(145deg,#2b5f91,#0f2a43)}
.t4 .ic{background:linear-gradient(145deg,#e6c36e,#b98a2b);color:#1a2330}
.card,.stat{border-radius:16px;border:1px solid var(--line);box-shadow:0 4px 14px rgba(15,42,67,.05)}
.stat{border-top:3px solid var(--acc)}
.chip{border-radius:999px;border:1.5px solid var(--line);padding:10px 18px;background:#fff;transition:all .15s}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(15,42,67,.25)}
input{border-radius:14px;border:1.5px solid var(--line);padding:13px 14px}
input:focus,button:focus-visible{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px rgba(201,162,74,.25)}
.dd{border-radius:14px;border:1.5px solid var(--line);box-shadow:0 2px 8px rgba(15,42,67,.05)}
.ddp{border-radius:14px;border:1.5px solid var(--acc);box-shadow:var(--sh)}
.ddo.on{background:#f4ead0;color:var(--navy)}
.go{border-radius:16px;padding:16px;letter-spacing:.02em;box-shadow:0 10px 22px rgba(15,42,67,.2)}
.go.in{background:linear-gradient(145deg,#37a07b,#1e7656)}
.go.out{background:linear-gradient(145deg,#d96a4f,#ab3d28)}
.b{border-radius:12px}
table{border-radius:12px;overflow:hidden}
th{background:linear-gradient(135deg,#0f2a43,#1f4d78);font-weight:600;letter-spacing:.02em}
.wrap{border-radius:12px;border:1px solid var(--line);background:#fff}
.toast{background:var(--navy);color:#fff;border-radius:999px;padding:12px 22px;box-shadow:0 10px 26px rgba(15,42,67,.35)}
dialog{border-radius:20px;box-shadow:0 24px 60px rgba(15,42,67,.35)}
.foot{margin-top:46px}
.foot b{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.22em;color:var(--navy)}
.foot span{letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.foot:before,.foot:after{content:"";display:block;height:1px;width:120px;margin:0 auto;background:linear-gradient(90deg,transparent,var(--acc),transparent)}
.foot:before{margin-bottom:14px}.foot:after{margin-top:14px}

  var t={id:Date.now(),ts:Date.now(),type:T,cat:cat,item:L,unit:unit,qty:v,note:note.trim(),sup:T==='in'?sup.trim():''};
  var mm=MIN[cat+'|'+L+'|'+unit],warn=T==='out'&&mm>0&&stock(cat,unit,L)-v<=mm;
  busy=true;
  if(T==='in'&&photo&&A){toast('ছবি আপলোড হচ্ছে…');try{var r=await A.upload(await shrink(photo));t.img=r.id}catch(e){busy=false;toast('ছবি আপলোড হয়নি, আবার চেষ্টা করো');return}}
  var ok=await put(t);busy=false;
  if(!ok)return;
  toast(T==='in'?'Stock in হয়েছে':(warn?'Stock out হয়েছে, স্টক কম!':'Stock out হয়েছে'));go('home');
}
function shrink(f){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var r=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){b?res(b):rej()},'image/jpeg',.7)};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(f)})}
async function put(t){try{await fs.doc('tx/'+t.id).set(t);return true}catch(e){fail(e);return false}}
async function del(id){try{await fs.doc('tx/'+id).delete();return true}catch(e){fail(e);return false}}
function fail(e){toast(e&&e.code==='permission-denied'?'আপনার এই কাজের অনুমতি নেই':'সেভ হয়নি, আবার চেষ্টা করো')}
async function persistMin(m){try{await fs.doc('cfg/min').set({m:Object.keys(m).map(function(k){return{k:k,v:m[k]}})});MIN=m;return true}catch(e){fail(e);return false}}

function minCell(ix){var p=PPK[ix],m=MIN[p.c+'|'+p.it+'|'+p.u];return RO?(m?num(m):'—'):'<button class="b" style="flex:none;padding:3px 9px" onclick="setMin('+ix+')">'+(m?num(m):'সেট')+'</button>'}

function setMin(i){var p=PPK[i],m=MIN[p.c+'|'+p.it+'|'+p.u];dlg('<h3 style="margin:0 0 4px">'+esc(p.it||p.c)+' ('+esc(p.u)+')</h3><div class="sub">স্টক এর নিচে নামলে Dashboard-এ সতর্কতা দেখাবে। বন্ধ করতে ০ লেখো।</div><h3>সর্বনিম্ন স্টক</h3><input id="mn" type="number" min="0" inputmode="decimal" value="'+(m||'')+'"><div class="btns"><button class="b" onclick="dclose()">বাতিল</button><button class="b" style="background:var(--acc);border-color:var(--acc)" onclick="saveMin('+i+')">সংরক্ষণ</button></div>')}

function editTx(id){var t=tget(id);dlg('<h3 style="margin:0 0 4px">'+esc(t.cat)+(t.item?' – '+esc(t.item):'')+'</h3><div class="sub">'+(t.type==='in'?'Stock in':'Stock out')+' · '+fd(t.ts)+'</div><h3>Quantity ('+esc(t.unit)+')</h3><input id="eq" type="number" min="0" inputmode="decimal" value="'+t.qty+'">'+(t.type==='in'?'<h3>Supplier name</h3><input id="es" value="'+esc(t.sup)+'">':'')+'<h3>নোট</h3><input id="en" value="'+esc(t.note)+'"><div class="btns"><button class="b" onclick="dclose()">বাতিল</button><button class="b" style="background:var(--acc);border-color:var(--acc)" onclick="saveEdit('+id+')">সংরক্ষণ</button></div>')}
async function saveEdit(id){
  var t=tget(id),v=parseFloat($('eq').value);if(!v||v<=0){$('eq').focus();return}
  if(stock(t.cat,t.unit,t.item)+(v-t.qty)*(t.type==='in'?1:-1)<0){toast('এতে স্টক মাইনাস হয়ে যাবে');return}
  var n=Object.assign({},t,{qty:v,note:$('en').value.trim()});if(t.type==='in')n.sup=$('es').value.trim();

function askDel(id){var t=tget(id);dlg('<h3 style="margin:0 0 6px">এই লেনদেন মুছবেন?</h3><div class="sub">'+esc(t.cat)+(t.item?' – '+esc(t.item):'')+' · '+(t.type==='in'?'+':'−')+num(t.qty)+' '+esc(t.unit)+'<br>'+fd(t.ts)+'</div><div class="btns"><button class="b" onclick="dclose()">না</button><button class="b" style="background:var(--low);border-color:var(--low);color:#fff" onclick="doDel('+id+')">মুছুন</button></div>')}
async function doDel(id){var t=tget(id);if(t.type==='in'&&stock(t.cat,t.unit,t.item)-t.qty<0){dclose();toast('মুছলে স্টক মাইনাস হয়ে যাবে');return}if(await del(id)){dclose();toast('মোছা হয়েছে');render()}}
function dl(name,data){DL.save({filename:name,data:data}).then(function(){toast('ফাইল সেভ হয়েছে')},function(e){if(!e||e.code!=='declined')toast('ফাইল সেভ হয়নি')})}
function csvq(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}
function csvR(){var rows=[['Date','Type','Material','Item','Unit','Quantity','Supplier','Note']].concat(inRange().slice().reverse().map(function(t){return [new Date(t.ts).toLocaleString('en-GB'),t.type==='in'?'Stock in':'Stock out',t.cat,t.item||'',t.unit,t.qty,t.sup||'',t.note||'']}));dl('smc-report.csv','\ufeff'+rows.map(function(r){return r.map(csvq).join(',')}).join('\r\n'))}

function bkSave(){dl('smc-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({v:1,tx:tx,min:minArr()}))}
async function importList(list){
  if(!list||!list.length){toast('ফাইলে কিছু নেই');return}
  var have={},n=0;tx.forEach(function(t){have[t.id]=1});toast('ফিরিয়ে আনা হচ্ছে…');
  for(var i=0;i<list.length;i++){var t=list[i];if(!t||!t.id||have[t.id]||!t.cat||!t.unit||!(t.qty>0)||(t.type!=='in'&&t.type!=='out'))continue;if(!await put(t))break;n++}
  toast(n+'টা লেনদেন যোগ হয়েছে');render()}
async function restore(d){

  if(d&&d.min&&d.min.length){var m=Object.assign({},MIN);d.min.forEach(function(x){if(x&&x.k&&x.v>0)m[x.k]=x.v});await persistMin(m)}
